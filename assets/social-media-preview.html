<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1200, initial-scale=1">
  <title>Social Media Preview</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --card: #ffffff;
      --text: #172033;
      --muted: #667085;
      --border: #d0d5dd;
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      width: 1200px;
      height: 630px;
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .frame {
      position: relative;
      display: grid;
      grid-template-columns: 500px 380px;
      gap: 30px;
      width: 100%;
      height: 100%;
      padding: 64px 72px;
      align-items: center;
      justify-content: start;
    }

    .copy {
      display: grid;
      gap: 24px;
    }

    .eyebrow {
      width: fit-content;
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 10px 16px;
      background: rgba(255, 255, 255, 0.74);
      color: var(--muted);
      font-size: 24px;
      font-weight: 650;
    }

    h1 {
      margin: 0;
      max-width: 500px;
      font-size: 62px;
      line-height: 0.98;
      letter-spacing: 0;
    }

    .subtitle {
      margin: 0;
      max-width: 500px;
      color: var(--muted);
      font-size: 29px;
      line-height: 1.25;
      font-weight: 500;
    }

    .features {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 8px;
    }

    .feature {
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px 16px;
      background: rgba(255, 255, 255, 0.7);
      color: var(--muted);
      font-size: 22px;
      font-weight: 650;
    }

    .mockup {
      position: relative;
      width: 380px;
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 24px;
      background: var(--card);
      box-shadow: 0 24px 60px rgba(23, 32, 51, 0.12);
      overflow: hidden;
    }

    .upload {
      display: grid;
      place-items: center;
      height: 170px;
      border: 3px dashed var(--border);
      border-radius: 18px;
      background: #fafbff;
      text-align: center;
    }

    .upload strong {
      display: block;
      margin-bottom: 10px;
      font-size: 26px;
    }

    .upload span {
      color: var(--muted);
      font-size: 19px;
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-top: 18px;
      align-items: end;
    }

    .select,
    .button {
      border-radius: 14px;
      padding: 16px 17px;
      font-size: 19px;
      font-weight: 750;
    }

    .select {
      border: 1px solid var(--border);
      background: white;
    }

    .label {
      display: block;
      margin-bottom: 8px;
      color: var(--text);
      font-size: 18px;
      font-weight: 700;
    }

    .button {
      background: var(--primary);
      color: white;
      text-align: center;
    }

    .chips {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      margin-top: 18px;
    }

    .chip {
      flex: 1;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px;
      background: rgba(245, 247, 251, 0.72);
      color: var(--muted);
      text-align: center;
      font-size: 15px;
      font-weight: 650;
    }
  </style>
</head>
<body>
  <main class="frame">
    <section class="copy">
      <div class="eyebrow">Free online image converter</div>
      <h1>Convert images to JPG or PNG</h1>
      <p class="subtitle">Upload WebP, HEIC and other image formats. Download a clean JPG or PNG in seconds.</p>
      <div class="features">
        <div class="feature">No account needed</div>
        <div class="feature">Images are not saved</div>
      </div>
    </section>

    <section class="mockup" aria-label="Image converter preview">
      <div class="upload">
        <div>
          <strong>Choose an image</strong>
          <span>WebP, HEIC, AVIF and more</span>
        </div>
      </div>
      <div class="controls">
        <div>
          <span class="label">Convert to</span>
          <div class="select">JPG</div>
        </div>
        <div class="button">Convert</div>
      </div>
      <div class="chips">
        <div class="chip">Supports WebP, HEIC, AVIF and more</div>
      </div>
    </section>
  </main>
</body>
</html>
